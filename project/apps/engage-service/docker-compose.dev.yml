version: '3.9'
services:
  readme.engage.postgres:
    image: postgres:14-alpine
    container_name: readme.engage.postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5433:5432
    volumes:
      - readme.postgres.engage:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - readme.engage

  readme.engage.pgadmin:
    image: dpage/pgadmin4
    container_name: readme.engage.pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - 8083:80
    depends_on:
      - readme.engage.postgres
    networks:
      - readme.engage

volumes:
  readme.postgres.engage:

networks:
  readme.engage:
      driver: bridge
